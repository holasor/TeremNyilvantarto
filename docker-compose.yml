version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: teremnyilvantarto_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SzeretemATejet123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: always

  backend:
    build: ./Backend
    container_name: teremnyilvantarto_backend
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DB_SERVER=db
      - DB_PORT=1433
      - DB_NAME=TeremNyilvantartoDB
      - DB_USER=sa
      - DB_PASSWORD=SzeretemATejet123!
    depends_on:
      - db
    restart: always

volumes:
  mssql_data: